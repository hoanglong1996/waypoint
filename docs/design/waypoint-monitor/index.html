<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waypoint Monitor</title>
  <meta name="color-scheme" content="light dark">
  <!-- Favicon: indigo rounded square with a white path / waypoint glyph -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M10 22.5c0-4.5 4.5-4.5 6-6.5s6-2 6-6.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='22.5' r='2.6' fill='%23fff'/%3E%3Ccircle cx='22' cy='9.5' r='3.2' fill='%23fff'/%3E%3C/svg%3E">
  <!-- One Google Fonts family (optional). Remove this link and the system stack takes over. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. Key: wp-theme */
    try { var t = localStorage.getItem('wp-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ============ GLOBAL HEADER ============ -->
  <header class="app-header">
    <div class="app-header__inner container">
      <!-- Product name always links Home -->
      <a class="brand" href="#/" aria-label="Waypoint Monitor, all pipelines">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#4f46e5"></rect>
          <path d="M10 22.5c0-4.5 4.5-4.5 6-6.5s6-2 6-6.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"></path>
          <circle cx="10" cy="22.5" r="2.6" fill="#fff"></circle>
          <circle cx="22" cy="9.5" r="3.2" fill="#fff"></circle>
        </svg>
        <span class="brand__name">Waypoint Monitor</span>
      </a>

      <div class="header-meta">
        <span class="live" id="live" aria-live="off">
          <span class="live__dot" aria-hidden="true"></span>
          <span>Updated <span id="live-age">12s</span> ago</span>
        </span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to dark theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"></path></svg>
        </button>
      </div>
    </div>

    <!-- Pipeline pages only: back link · pipeline name · Latest | History -->
    <div class="ctxbar" id="ctxbar" hidden>
      <div class="ctxbar__inner container">
        <a class="backlink" href="#/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>All pipelines
        </a>
        <span class="ctxbar__sep" aria-hidden="true"></span>
        <p class="ctxbar__name" id="ctx-name">—</p>
        <nav class="tabs" aria-label="Pipeline views">
          <a class="tabs__tab" id="tab-latest" href="#/">Latest</a>
          <a class="tabs__tab" id="tab-history" href="#/">History</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main id="main" class="container main">
    <!-- Global banners (data-store error, stale, partial read) are injected here -->
    <div id="banners" class="banners"></div>

    <section id="view-home" class="view" aria-label="All pipelines"></section>
    <section id="view-latest" class="view" aria-label="Latest run" hidden></section>
    <section id="view-history" class="view" aria-label="History" hidden></section>
    <section id="view-notfound" class="view" hidden></section>
  </main>

  <!-- ============ RUN DETAIL DRAWER (History) ============ -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer__scrim" data-close></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer__head">
        <div>
          <p class="eyebrow">Run details</p>
          <h2 id="drawer-title" class="drawer__title">—</h2>
        </div>
        <button class="icon-btn" type="button" data-close aria-label="Close run details">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </header>
      <div class="drawer__body" id="drawer-body"></div>
    </aside>
  </div>

  <!-- Chart / graph tooltip (shared) -->
  <div class="tooltip" id="tooltip" role="presentation" hidden></div>

  <!-- ============ DESIGN-TIME TOOL — NOT PART OF THE PRODUCT ============
       Lets reviewers preview each state. Delete this block (and the proto
       section in app.js) when building the real app. -->
  <aside class="proto" id="proto" aria-label="Design-time preview, not part of the product">
    <span class="proto__tag">Design tool</span>
    <label for="proto-state" class="proto__label">Preview state</label>
    <select id="proto-state">
      <optgroup label="Finished runs">
        <option value="healthy">Healthy run</option>
        <option value="incomplete">Incomplete run</option>
        <option value="loss">Data-loss step</option>
        <option value="stale">Stale run (&gt; 26 h)</option>
        <option value="partial">Some records unreadable (also Home)</option>
      </optgroup>
      <optgroup label="Live">
        <option value="running">Running step + waiting steps</option>
        <option value="running-start">Run started, nothing reported</option>
        <option value="stalled">Stalled step</option>
      </optgroup>
      <optgroup label="Flow description">
        <option value="other">Other steps + dangling input + problems</option>
        <option value="simple-missing">Simple mode: no description</option>
        <option value="simple-unreadable">Simple mode: unreadable</option>
        <option value="simple-version">Simple mode: newer record version</option>
      </optgroup>
      <optgroup label="Home page">
        <option value="long">Very long pipeline name</option>
        <option value="many">Many pipelines (22)</option>
      </optgroup>
      <optgroup label="Page states (Home and pipeline pages)">
        <option value="loading">Loading</option>
        <option value="empty">Empty (no runs)</option>
        <option value="error">Data store unreachable</option>
      </optgroup>
    </select>
  </aside>

  <script src="graph.js"></script>
  <script src="app.js"></script>
</body>
</html>
