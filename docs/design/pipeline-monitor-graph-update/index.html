<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipeline Monitor</title>
  <meta name="color-scheme" content="light dark">
  <!-- One Google Fonts family (optional). Remove this link and the system stack takes over. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    try { var t = localStorage.getItem('pm-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ============ GLOBAL HEADER ============ -->
  <header class="app-header">
    <div class="app-header__inner container">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="3" width="6" height="6" rx="1.5"></rect>
          <rect x="16" y="9" width="6" height="6" rx="1.5"></rect>
          <rect x="2" y="15" width="6" height="6" rx="1.5"></rect>
          <path d="M8 6h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8M13 12h3" fill="none"></path>
        </svg>
        <span class="brand__name">Pipeline Monitor</span>
        <span class="brand__sub">CallRail × Google Ads</span>
      </div>

      <fieldset class="segmented" aria-label="Environment">
        <legend class="sr-only">Environment</legend>
        <label class="segmented__opt"><input type="radio" name="env" value="prod" checked><span>prod</span></label>
        <label class="segmented__opt"><input type="radio" name="env" value="qa"><span>qa</span></label>
      </fieldset>

      <div class="header-meta">
        <span class="live" id="live" aria-live="off">
          <span class="live__dot" aria-hidden="true"></span>
          <span>Updated <span id="live-age">12s</span> ago</span>
        </span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to dark theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"></path></svg>
        </button>
      </div>

      <nav class="tabs" role="tablist" aria-label="Views">
        <button class="tabs__tab" role="tab" id="tab-latest" aria-controls="view-latest" aria-selected="true" type="button">Latest</button>
        <button class="tabs__tab" role="tab" id="tab-history" aria-controls="view-history" aria-selected="false" tabindex="-1" type="button">History</button>
      </nav>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main id="main" class="container main">
    <!-- Global banners (data-store error, stale, partial read) are injected here -->
    <div id="banners" class="banners"></div>

    <section id="view-latest" role="tabpanel" aria-labelledby="tab-latest" class="view"></section>
    <section id="view-history" role="tabpanel" aria-labelledby="tab-history" class="view" hidden></section>
  </main>

  <!-- ============ RUN DETAIL DRAWER (History) ============ -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer__scrim" data-close></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer__head">
        <div>
          <p class="eyebrow">Run details</p>
          <h2 id="drawer-title" class="drawer__title">—</h2>
        </div>
        <button class="icon-btn" type="button" data-close aria-label="Close run details">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </header>
      <div class="drawer__body" id="drawer-body"></div>
    </aside>
  </div>

  <!-- Chart tooltip (shared) -->
  <div class="tooltip" id="tooltip" role="presentation" hidden></div>

  <!-- ============ PROTOTYPE-ONLY: state switcher ============ -->
  <div class="proto" id="proto">
    <label for="proto-state" class="proto__label">Preview state</label>
    <select id="proto-state">
      <option value="healthy">Healthy run</option>
      <option value="incomplete">Incomplete run</option>
      <option value="loss">Data-loss step</option>
      <option value="stale">Stale run (&gt; 26 h)</option>
      <option value="partial">Some records unreadable</option>
      <option value="loading">Loading</option>
      <option value="empty">Empty (no runs)</option>
      <option value="error">Data store unreachable</option>
    </select>
  </div>

  <script src="graph.js"></script>
  <script src="app.js"></script>
</body>
</html>
