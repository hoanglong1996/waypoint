<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waypoint Monitor</title>
  <meta name="color-scheme" content="light dark">
  <!-- One Google Fonts family (optional). Remove this link and the system stack takes over. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M7 8h4a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h2' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    try { var t = localStorage.getItem('wp-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ============ GLOBAL HEADER ============ -->
  <header class="app-header">
    <div class="app-header__inner container">
      <!-- Product name always links Home -->
      <a class="brand" href="#/" aria-label="Waypoint Monitor, all pipelines">
        <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="3" width="6" height="6" rx="1.5"></rect>
          <rect x="16" y="9" width="6" height="6" rx="1.5"></rect>
          <rect x="2" y="15" width="6" height="6" rx="1.5"></rect>
          <path d="M8 6h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8M13 12h3" fill="none"></path>
        </svg>
        <span class="brand__name">Waypoint Monitor</span>
      </a>

      <div class="header-meta">
        <span class="live" id="live" aria-live="off">
          <span class="live__dot" aria-hidden="true"></span>
          <span>Updated <span id="live-age">12s</span> ago</span>
        </span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to dark theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"></path></svg>
        </button>
      </div>
    </div>

    <!-- Pipeline pages only: All pipelines › pipeline › run time -->
    <div class="ctxbar" id="ctxbar" hidden>
      <nav class="ctxbar__inner container" aria-label="Breadcrumb">
        <a class="backlink" href="#/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>All pipelines
        </a>
        <span class="ctxbar__sep" aria-hidden="true"></span>
        <a class="ctxbar__name" id="ctx-name" href="#/">—</a>
        <span class="ctxbar__chev" id="ctx-chev" aria-hidden="true" hidden>›</span>
        <p class="ctxbar__run" id="ctx-run" aria-current="page" hidden>—</p>
      </nav>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main id="main" class="container main">
    <!-- Global banners (data-store error, stale, partial read) are injected here -->
    <div id="banners" class="banners"></div>

    <section id="view-home" class="view" aria-label="All pipelines" hidden></section>
    <section id="view-history" class="view" aria-label="History" hidden></section>
    <section id="view-run" class="view" aria-label="Run details" hidden></section>
    <section id="view-notfound" class="view" hidden></section>
  </main>

  <!-- Chart tooltip (shared) -->
  <div class="tooltip" id="tooltip" role="presentation" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
