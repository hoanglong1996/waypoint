[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waypoint-etl"
version = "0.6.2"
description = "Waypoint: per-step tracking for ETL pipelines, written to Redis for Waypoint Monitor."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
redis = ["redis==5.0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waypoint_etl = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
